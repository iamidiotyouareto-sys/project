<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050517">
<title>MOVE | Home workouts</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23050517'/%3E%3Cpath transform='translate(3 3) scale(.75)' fill='%23CF5C36' d='M12 0C12.9 7.2 16.8 11.1 24 12C16.8 12.9 12.9 16.8 12 24C11.1 16.8 7.2 12.9 0 12C7.2 11.1 11.1 7.2 12 0Z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#050517; --navy-2:#0d0d28; --navy-3:#17173b;
  --orange:#CF5C36; --orange-hi:#E06D46; --orange-lo:#B54D2B;
  --cream:#EFC88B; --cream-dim:rgba(239,200,139,.76); --cream-faint:rgba(239,200,139,.11); --cream-mid:rgba(239,200,139,.22);
  --line:rgba(239,200,139,.16); --line-strong:rgba(239,200,139,.4);
  --ink:#050517; --ink-dim:rgba(5,5,23,.74);
  --display:'Barlow Condensed','Arial Narrow','Roboto Condensed','Helvetica Neue',Arial,sans-serif;
  --body:'Figtree','Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --nav-h:68px; --tab-h:72px;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--navy);color:var(--cream);font-family:var(--body);font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
svg{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-64px;z-index:300;background:var(--cream);color:var(--ink);padding:.75rem 1rem;border-radius:12px;font-weight:700;text-decoration:none}
.skip:focus{top:12px}
:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
.on-cream :focus-visible{outline-color:var(--navy)}
.sparkle{width:1em;height:1em;flex:none}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;min-height:52px;padding:0 1.5rem;border-radius:999px;border:2px solid transparent;background:none;font:700 1.05rem/1 var(--body);text-decoration:none;white-space:nowrap;transition:transform .16s ease,background-color .16s,color .16s,border-color .16s,box-shadow .16s}
.btn svg{width:22px;height:22px;flex:none}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--orange);color:var(--ink)}
.btn-primary:hover{background:var(--orange-hi);transform:translateY(-1px);box-shadow:0 10px 24px -12px var(--orange)}
.btn-primary:active{background:var(--orange-lo);transform:scale(.97)}
.btn-ghost{border-color:var(--line-strong);color:var(--cream)}
.btn-ghost:hover{background:var(--cream-faint);border-color:var(--cream)}
.btn-cream{background:var(--cream);color:var(--ink)}
.btn-cream:hover{background:#f6d7a4;transform:translateY(-1px)}
.btn-added{border-color:var(--cream);color:var(--cream);background:var(--cream-faint)}
.btn-added:hover{background:var(--cream-mid)}
.btn-lg{min-height:64px;padding:0 2.2rem;font-size:1.2rem}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.link-btn{white-space:nowrap;background:none;border:0;min-height:44px;padding:0 4px;color:var(--cream);font-weight:600;text-decoration:underline;text-decoration-color:var(--orange);text-decoration-thickness:2px;text-underline-offset:5px}
.link-btn:hover{color:#fff3dc}
.icon-btn{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line-strong);background:none;transition:background-color .16s,border-color .16s}
.icon-btn:hover{background:var(--cream-faint);border-color:var(--cream)}
.icon-btn svg{width:22px;height:22px}

/* ---------- top / bottom nav ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(5,5,23,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1200px;margin:0 auto;height:var(--nav-h);padding:0 20px;display:flex;align-items:center;gap:24px}
.logo{display:inline-flex;align-items:center;background:none;border:0;padding:4px 0;color:var(--cream);font:800 italic 2.15rem/1 var(--display);letter-spacing:.01em}
.logo .sparkle{color:var(--orange);width:.86em;height:.86em;margin:0 .03em;transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.logo:hover .sparkle{transform:rotate(90deg) scale(1.08)}
.nav-top{display:flex;gap:6px;margin-left:auto}
.navlink{min-height:44px;padding:0 1.1rem;border-radius:999px;border:0;background:none;color:var(--cream);font-weight:600;font-size:1rem;transition:background-color .16s,color .16s}
.navlink:hover{background:var(--cream-faint)}
.navlink[aria-current=page]{background:var(--orange);color:var(--ink)}
.streak-chip{display:none;margin-left:auto;align-items:center;gap:.4rem;padding:.35rem .8rem;border-radius:999px;background:var(--cream-faint);font-weight:700;font-size:.9rem}
.streak-chip .sparkle{color:var(--orange)}
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(13,13,40,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabbar-in{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:560px;margin:0 auto}
.tab{min-height:58px;border:0;background:none;color:var(--cream-dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 .75rem/1.1 var(--body);border-radius:16px}
.tab .ico{width:48px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background-color .2s,color .2s}
.tab .ico svg{width:23px;height:23px}
.tab[aria-current=page]{color:var(--cream)}
.tab[aria-current=page] .ico{background:var(--orange);color:var(--ink)}
@media(max-width:859px){
  .tabbar{display:block}.nav-top{display:none}.streak-chip{display:inline-flex}
  .topbar-in{height:60px}
  .page{padding-bottom:calc(var(--tab-h) + 40px + env(safe-area-inset-bottom))!important}
}

/* ---------- layout ---------- */
.page{max-width:1200px;margin:0 auto;padding:28px 20px 72px;outline:none;animation:pagein .18s ease-out}
@keyframes pagein{from{opacity:0}to{opacity:1}}
.page-title{font:800 italic clamp(2.5rem,7vw,3.8rem)/.95 var(--display)}
.page-sub{color:var(--cream-dim);max-width:58ch;margin-top:.7rem;font-size:1.06rem}
.page-head{margin-bottom:26px}
.section{margin-top:44px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px}
.section-title{font:800 italic clamp(1.75rem,4vw,2.3rem)/1 var(--display)}
.card{background:var(--navy-2);border:1px solid var(--line);border-radius:22px;padding:20px}
.muted{color:var(--cream-dim)}
.tag{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:.28rem .75rem;font:600 .82rem/1.25 var(--body);background:var(--cream-faint);color:var(--cream)}
.tag-cream{background:var(--cream);color:var(--ink)}
.dots{display:inline-flex;gap:3px}
.dots i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.3}
.dots i.on{opacity:1;background:var(--orange)}
.tag-cream .dots i.on{background:var(--orange)}

/* ---------- illustration ---------- */
.art{background:var(--navy-3);position:relative;overflow:hidden;aspect-ratio:200/142}
.art>svg.fig{position:absolute;inset:0;width:100%;height:100%}
.art .art-spark{position:absolute;left:10px;bottom:8px;width:16px;height:16px;color:var(--orange);opacity:.75}
.mini{width:76px;flex:none;border-radius:14px}
.fig .f-seg{fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .f-torso{stroke-width:9}
.fig .f-limb{stroke-width:6.5}
.fig .f-base{stroke:var(--cream)}
.fig .f-hi{stroke:var(--orange)}
.fig .f-far{opacity:.5}
.fig .f-head{fill:var(--cream)}
.fig .f-floor{stroke:var(--cream);stroke-width:1.5;opacity:.2}
.fig .f-prop{fill:none;stroke:var(--cream);stroke-width:3;stroke-linecap:round;opacity:.38}
.fig .f-band{fill:none;stroke:var(--orange);stroke-width:2.5;stroke-linecap:round;opacity:.9}

/* ---------- choices (native radios/checkboxes) ---------- */
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{position:relative;display:inline-flex}
.choice input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
.choice>span{display:inline-flex;align-items:center;gap:.5rem;min-height:48px;padding:0 1.15rem;border-radius:999px;border:1.5px solid var(--line-strong);color:var(--cream);font-weight:600;transition:background-color .16s,border-color .16s,color .16s,transform .16s}
.choice input:hover+span{border-color:var(--cream);background:var(--cream-faint)}
.choice input:checked+span{background:var(--orange);border-color:var(--orange);color:var(--ink)}
.choice input:focus-visible+span{outline:3px solid var(--cream);outline-offset:3px}
.choice input:active+span{transform:scale(.97)}
.choice .mk{display:none;width:15px;height:15px}
.choice input:checked+span .mk{display:inline-block}
.field{display:grid;gap:10px}
.field-l{font-weight:700;font-size:1.05rem}
.field-h{color:var(--cream-dim);font-size:.9rem;margin-top:-4px}

/* ---------- home ---------- */
.greet{color:var(--cream-dim);font-weight:600;font-size:1.05rem}
.hero-line{font:800 italic clamp(2.8rem,9vw,5.4rem)/.9 var(--display);margin:.35rem 0 26px;max-width:14ch}
.home-grid{display:grid;gap:26px;grid-template-columns:minmax(0,1fr)}
@media(min-width:980px){.home-grid{grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);gap:32px}}
.today{position:relative;overflow:hidden;background:var(--cream);color:var(--ink);border-radius:32px;padding:26px;display:grid;gap:20px;grid-template-columns:minmax(0,1fr);box-shadow:0 30px 50px -30px rgba(0,0,0,.85)}
@media(min-width:700px){.today{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);padding:32px;align-items:center}}
.today-copy{position:relative;z-index:2}
.today h2{font:800 italic clamp(2.2rem,5vw,3.3rem)/.93 var(--display);margin:.15rem 0 1rem}
.today .kicker{font-weight:700;color:var(--ink-dim)}
.today-stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.tstat{background:rgba(5,5,23,.09);border-radius:16px;padding:.55rem .95rem;min-width:88px}
.tstat b{display:block;font:800 italic 1.9rem/1 var(--display)}
.tstat span{font-size:.85rem;color:var(--ink-dim);font-weight:600}
.today .btn-primary:hover{background:var(--orange-hi)}
.today-art{position:relative;z-index:2;border-radius:24px;overflow:hidden;box-shadow:0 20px 30px -22px rgba(5,5,23,.9)}
.deco{position:absolute;color:var(--orange);pointer-events:none}
.deco.d1{width:170px;height:170px;right:-46px;top:-52px;opacity:.95;animation:sparkin .9s cubic-bezier(.2,1.3,.4,1) both}
.deco.d2{width:44px;height:44px;left:46%;bottom:18px;color:var(--navy);opacity:.9;animation:sparkin .9s .18s cubic-bezier(.2,1.3,.4,1) both}
.deco.d3{width:24px;height:24px;right:31%;top:20px;color:var(--navy);animation:sparkin .9s .32s cubic-bezier(.2,1.3,.4,1) both}
@keyframes sparkin{from{transform:scale(0) rotate(-90deg);opacity:0}to{transform:scale(1) rotate(0)}}
@media(max-width:699px){.deco.d2{display:none}.deco.d1{width:120px;height:120px;right:-34px;top:-38px}}
.qg-row{display:flex;gap:12px;overflow-x:auto;padding:4px 20px 10px;margin:0 -20px;scroll-snap-type:x proximity;scroll-padding:0 20px;scrollbar-width:none}
.qg-row::-webkit-scrollbar{display:none}
.qg{flex:none;width:118px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px 12px;border-radius:20px;border:1px solid var(--line);background:var(--navy-2);color:var(--cream);font-weight:700;font-size:.92rem;line-height:1.15;text-align:center;transition:transform .18s,border-color .18s,background-color .18s}
.qg:hover{transform:translateY(-3px);border-color:var(--line-strong);background:var(--navy-3)}
.qg svg{width:48px;height:48px}
@media(min-width:700px){.qg-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));overflow:visible;margin:0;padding:0}.qg{width:auto}}
.glyph{color:var(--cream)}
.glyph .g-base{stroke:currentColor;opacity:.55;fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.glyph .g-fill{fill:currentColor;opacity:.55}
.glyph .g-hi{stroke:var(--hi,var(--orange));fill:none;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}
.glyph .g-hifill{fill:var(--hi,var(--orange));stroke:var(--hi,var(--orange));stroke-width:1.5;stroke-linejoin:round}
.list{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:var(--navy-2);border:1px solid var(--line)}
.row-badge{width:42px;height:42px;border-radius:50%;background:var(--orange);color:var(--ink);display:grid;place-items:center;flex:none}
.row-badge .sparkle{width:20px;height:20px}
.row-main{min-width:0;flex:1}
.row-title{font-weight:700}
.row-sub{color:var(--cream-dim);font-size:.9rem}
.row-end{font:800 italic 1.5rem/1 var(--display);color:var(--cream);text-align:right;white-space:nowrap}
.week{padding:22px}
.week-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:16px 0 18px}
.wd{display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;font-size:.85rem;color:var(--cream-dim)}
.wd-dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1.5px dashed var(--line-strong);color:var(--ink);transition:background-color .2s}
.wd.on .wd-dot{background:var(--orange);border:0}
.wd.on .sparkle{width:20px;height:20px}
.wd.is-today .wd-dot{outline:2px solid var(--cream);outline-offset:3px}
.wd.is-today{color:var(--cream)}
.bar{height:12px;border-radius:99px;background:var(--cream-mid);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--orange);transition:width .5s ease}
.week-foot{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-weight:600}

/* ---------- workouts / groups ---------- */
.seg-tabs{display:inline-flex;padding:5px;border-radius:999px;background:var(--navy-2);border:1px solid var(--line);gap:4px;margin-bottom:26px}
.seg-tabs button{min-height:46px;padding:0 1.4rem;border-radius:999px;border:0;background:none;font-weight:700;color:var(--cream);transition:background-color .16s,color .16s}
.seg-tabs button:hover{background:var(--cream-faint)}
.seg-tabs button[aria-pressed=true]{background:var(--orange);color:var(--ink)}
.ggrid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:640px){.ggrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:980px){.ggrid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.gcard{position:relative;display:block;border-radius:22px}
.gcard input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
.gcard-in{height:100%;display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:22px;background:var(--navy-2);border:1.5px solid var(--line);transition:transform .18s,border-color .18s,background-color .18s,color .18s}
.gcard-in svg{width:60px;height:60px;margin-bottom:6px}
.gname{font:800 italic 1.6rem/1 var(--display)}
.gcount{font-size:.88rem;color:var(--cream-dim);font-weight:600}
.gcard input:hover+.gcard-in{transform:translateY(-3px);border-color:var(--line-strong)}
.gcard input:checked+.gcard-in{background:var(--orange);border-color:var(--orange);color:var(--ink);--hi:var(--cream)}
.gcard input:checked+.gcard-in .gcount{color:var(--ink-dim)}
.gcard input:checked+.gcard-in .glyph{color:var(--ink)}
.gcard input:focus-visible+.gcard-in{outline:3px solid var(--cream);outline-offset:3px}
.group-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;scroll-margin-top:84px}
.exgrid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(268px,1fr))}
.excard{display:flex;flex-direction:column;background:var(--navy-2);border:1px solid var(--line);border-radius:24px;overflow:hidden;transition:border-color .2s,transform .2s,box-shadow .2s}
.excard:hover{border-color:var(--line-strong);transform:translateY(-3px);box-shadow:0 22px 36px -24px #000}
.excard-body{display:flex;flex-direction:column;gap:12px;padding:16px 18px 18px;flex:1}
.excard h3{font:800 italic 1.8rem/1 var(--display)}
.excard .tgt{color:var(--cream-dim);font-size:.92rem;margin-top:-6px}
.excard .desc{font-size:.95rem;color:var(--cream-dim);flex:1}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.spec{background:rgba(239,200,139,.08);border-radius:14px;padding:.55rem .85rem}
.spec-l{display:block;font-size:.8rem;color:var(--cream-dim);font-weight:600}
.spec-v{display:block;font-weight:800;font-size:1.05rem}

/* library filters */
.filters{display:grid;gap:18px;margin-bottom:24px;padding:20px}
.filter-row{display:grid;gap:8px}
.chip-scroll{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 8px;margin:0 -4px;scrollbar-width:thin}
.search{position:relative;max-width:420px}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--cream-dim)}
.search input{width:100%;min-height:52px;border-radius:999px;border:1.5px solid var(--line-strong);background:var(--navy);padding:0 1.2rem 0 3rem;color:var(--cream)}
.search input::placeholder{color:var(--cream-dim)}
.search input:focus{outline:3px solid var(--cream);outline-offset:3px}
.results-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;font-weight:600}
.empty{padding:44px 20px;text-align:center;border:1.5px dashed var(--line-strong);border-radius:24px;display:grid;justify-items:center;gap:14px}
.empty .sparkle{width:34px;height:34px;color:var(--orange)}

/* ---------- builder ---------- */
.builder{display:grid;gap:26px;grid-template-columns:minmax(0,1fr)}
@media(min-width:980px){.builder{grid-template-columns:minmax(0,420px) minmax(0,1fr);align-items:start}.controls{position:sticky;top:88px}}
.controls{display:grid;gap:24px;padding:24px;border-radius:26px}
.result{padding:24px;border-radius:26px;scroll-margin-top:84px}
.result-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:20px}
.result-title{font:800 italic clamp(1.9rem,4vw,2.5rem)/.95 var(--display)}
.big-stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.bstat{background:var(--navy);border:1px solid var(--line);border-radius:16px;padding:.6rem 1rem;min-width:96px}
.bstat b{display:block;font:800 italic 2.1rem/1 var(--display);color:var(--orange)}
.bstat span{font-size:.85rem;color:var(--cream-dim);font-weight:600}
.timeline{position:relative;display:grid;gap:0}
.wrow{display:grid;grid-template-columns:34px 76px minmax(0,1fr);gap:12px;align-items:center;padding:8px 0}
.wnum{width:34px;height:34px;border-radius:50%;background:var(--cream);color:var(--ink);display:grid;place-items:center;font:800 1.1rem/1 var(--display);position:relative;z-index:1}
.wname{font-weight:700;font-size:1.05rem;line-height:1.2}
.wspec{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--cream-dim);font-size:.92rem;margin-top:3px}
.wspec b{color:var(--cream)}
.wrest{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:center;color:var(--cream-dim);font-size:.85rem;font-weight:600}
.wrest i{justify-self:center;width:2px;height:26px;background:repeating-linear-gradient(to bottom,var(--line-strong) 0 4px,transparent 4px 8px)}
.result-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}

.split i{display:block;height:100%}
.split .w{background:var(--orange)}.split .r{background:var(--cream)}

.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.res-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-weight:600}
.res-row:last-child{border:0}
.res-row .ck{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}

function totalSec(items){return items.reduce((a,x)=>a+x.work,0)+items.slice(0,-1).reduce((a,x)=>a+x.rest,0);}
function specText(ex,work){if(ex.hold)return 'Hold '+work+' sec';if(ex.tempo){return Math.max(4,Math.round(work/ex.tempo))+' '+(ex.unit||'reps');}return work+' sec';}

function fmtMin(sec){return Math.max(1,Math.round(sec/60));}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,rnd){const a=arr.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(rnd()*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a;}

function generate(o){
  const rnd=mulberry32(o.seed*7919+13);
  const L=LEVELS[o.level],lv=LEVEL_NAMES.indexOf(o.level);
  const allowed=new Set(['none',...o.equip]);
  const sel=o.groups.length?o.groups:['full'];
  const wantsFull=sel.includes('full'),others=sel.filter(x=>x!=='full');
  const mobOnly=sel.length===1&&sel[0]==='mobility';
  let pool=EX.filter(ex=>ex.lvl<=lv&&allowed.has(ex.eq)&&(others.some(x=>ex.g.includes(x))||(wantsFull&&!isMob(ex))));
  let note='';
  if(!pool.length){pool=EX.filter(ex=>ex.lvl<=lv&&ex.eq==='none'&&!isMob(ex));note='Nothing matched your choices, so we picked a full-body mix.';}
  const wcN=mobOnly?0:(o.duration>=20?2:o.duration>=10?1:0);
  const warm=['armcircles','catcow'].slice(0,wcN),cool=['hipflexor','sidestretch'].slice(0,wcN);
  if(wcN)pool=pool.filter(ex=>!warm.includes(ex.id)&&!cool.includes(ex.id))||pool;
  if(!pool.length)pool=EX.filter(ex=>ex.lvl<=lv&&ex.eq==='none'&&!isMob(ex));
  const buckets={};
  shuffle(pool,rnd).sort((a,c)=>Math.abs(lv-a.lvl)-Math.abs(lv-c.lvl)).forEach(ex=>{(buckets[ex.g[0]]=buckets[ex.g[0]]||[]).push(ex);});
  const keys=shuffle(Object.keys(buckets),rnd);
  const seq=[];let guard=0;
  while(seq.length<60&&guard++<200){let added=false;for(const k of keys){const bk=buckets[k];const ex=bk[Math.floor(seq.length/keys.length)%bk.length];if(ex){seq.push(ex);added=true;}}if(!added)break;}
  const mk=(id,i,role)=>({uid:id+'-'+i+'-'+role,exId:id,work:30,rest:10,role});
  let best=null;
  for(let n=2;n<=40;n++){
    const items=[...warm.map((id,k)=>mk(id,k,'Warm-up')),...seq.slice(0,n).map((ex,k)=>({uid:ex.id+'-'+k,exId:ex.id,work:L.work,rest:isMob(ex)?Math.min(L.rest,15):L.rest})),...cool.map((id,k)=>mk(id,k,'Cool-down'))];
    const diff=Math.abs(totalSec(items)-o.duration*60);
    if(!best||diff<best.diff)best={diff,items};
    if(seq.length<n)break;
  }
  const rounds=Math.ceil(best.items.filter(x=>!x.role).length/Math.max(1,new Set(best.items.filter(x=>!x.role).map(x=>x.exId)).size));
  const names=sel.map(x=>GM[x].short);
  const title=sel.includes('full')&&sel.length===1?'Full-body workout':names.length<=2?names.join(' and ')+' workout':'Custom mix workout';
  return {title,items:best.items,note,rounds};
}

function sameDay(a,c){return a.getFullYear()===c.getFullYear()&&a.getMonth()===c.getMonth()&&a.getDate()===c.getDate();}

function weekStreak(hist,goal){
  const counts={};hist.forEach(x=>{const k=startOfWeek(new Date(x.ts)).getTime();counts[k]=(counts[k]||0)+1;});
  const cur=startOfWeek(new Date());let streak=0;
  for(let k=0;k<200;k++){const d=new Date(cur);d.setDate(d.getDate()-7*k);const c=counts[d.getTime()]||0;if(c>=goal)streak++;else if(k===0)continue;else break;}
  return streak;
}

/* ---------- active workout ---------- */
function initActive(items){return {items,idx:0,phase:'prep',total:5000,rem:5000,paused:false,last:performance.now(),work:0,rest:0,res:items.map(()=>null)};}
function begin(s,idx,res){const t=s.items[idx].work*1000;return {...s,idx,res,phase:'work',total:t,rem:t};}

    const r=items[s.idx].rest*1000;

  if(s.phase==='rest')return begin(s,s.idx+1,res);

function activeReducer(s,a){

function Active(p){

          div({className:'row2'},

            isRest?button({className:'btn btn-ghost',onClick:()=>dispatch({type:'extend'})},h(Icon,{n:'plus'}),'15 sec'):button({className:'btn btn-ghost',onClick:()=>dispatch({type:'finish'})},h(Icon,{n:'check'}),'Done early'))),

        (s.phase==='work'?div({className:'up-next'},div(null,b('Last exercise'),span('Finish strong, then you are done.'))):null))),

/* ---------- workout complete ---------- */
function Complete(p){

function App(){

  const addMany=ids=>{setCustom(c=>[...c,...ids.filter(x=>!c.includes(x))]);notify('Added '+ids.length+' exercises to My workout');};
  const start=(title,items)=>{primeAudio();setSession({title,items});setDrawer(false);setView('active');};
  const startCustom=()=>{const items=custom.map((id,k)=>mkItem(id,LEVEL_NAMES[EXM[id].lvl],k));start('My workout',items);};
  const openGroup=id=>{setSelGroup(id);setWtab('groups');setView('workouts');};

  const shared={prefs,hist,go,start,openGroup,openBuilder,custom,toggleCustom,addMany,setPrefs,opts,setOpts,wtab,setWtab,selGroup,setSelGroup,reset};

  else if(view==='exercises')page=h(Library,shared);
  else if(view==='progress')page=h(Progress,shared);
  else page=h(Profile,shared);
  const total=custom.reduce((a,id,k)=>a+mkItem(id,LEVEL_NAMES[EXM[id].lvl],k).work,0)+custom.slice(0,-1).reduce((a,id,k)=>a+mkItem(id,LEVEL_NAMES[EXM[id].lvl],k).rest,0);
